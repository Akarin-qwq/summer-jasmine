    <meta name="description" content="视觉小说『小城茉莉』是一部百合向的角色扮演游戏。玩家将以朱雨桐的视角游玩，体验一段纠结、懵懂的夏日时光，通过点击选择导向最终不同的结局。这是一个关于“许愿”的故事，我们都曾幻想过有朝一日可以回到过去改变自己。好像抚平过去的伤疤未来的噩梦便不会发生。这也是一个关于“遗忘”的故事，将要离开家乡的孩子、一张去往远方的车票、一座逐渐变得陌生的城市。当旧的景色褪去，记忆成了泛黄的老照片。夏天、小城、茉莉。离开与留下，被隐瞒的真相。每一天枯燥重复的日常下主人公们又将如何面对自己的命运。做个梦吧，一起回到那个和熙的夏日午后，在教室的课桌上打哈欠，林荫道的树荫下嬉笑打闹，品尝美味的慕斯蛋糕，小心翼翼的尝试未知的菜品。故事会走向何方？最终的结局由您的选择而定。">
